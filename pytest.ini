[pytest]
testpaths = tests
asyncio_mode = auto
; One event loop for the whole session — the app's global async engine pools
; connections bound to a loop; per-test loops would poison the pool with
; "attached to a different loop" errors.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
