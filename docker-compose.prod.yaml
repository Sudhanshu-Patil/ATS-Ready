##############################################################################
# docker-compose.prod.yaml — ATS-Ready production stack (self-hosted, $0)
#
# One image serves both the API and the built React SPA (FastAPI static
# mount + client-side-routing fallback in main.py) — no separate frontend
# container, no Vite dev server, no paid services anywhere.
#
# Required in .env before starting (startup FAILS FAST on dev defaults):
#   ENVIRONMENT is forced to production below — config.py then refuses a
#   weak JWT_SECRET or the dev password "secret" in DB/Redis URLs.
#     JWT_SECRET=<openssl rand -hex 32>
#     POSTGRES_PASSWORD=<strong password>
#     REDIS_PASSWORD=<strong password>
#     LLM_API_KEY=<your key>
#
# Usage:
#   docker compose -f docker-compose.prod.yaml up -d --build
#   docker compose -f docker-compose.prod.yaml exec api alembic upgrade head
#   → app served at http://<host>:8000  (put a TLS reverse proxy in front
#     for a real domain — Caddy does free auto-HTTPS)
#
# Generated resumes persist in the named `outputs` volume, shared between
# the worker (writes .docx) and the api (serves /outputs downloads) —
# they survive container recreation without paid object storage.
##############################################################################

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       atsready
      POSTGRES_USER:     atsready
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    # No host port — reachable only on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atsready -d atsready"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env} --maxmemory 256mb --maxmemory-policy allkeys-lru
    # No host port — reachable only on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Caddy (TLS reverse proxy — free auto-HTTPS) ─────────────────────────────
  # SITE_ADDRESS=":80" (default) serves plain HTTP on the server IP.
  # SITE_ADDRESS="yourapp.duckdns.org" turns on automatic Let's Encrypt TLS.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    # No host port — all traffic flows through Caddy on 80/443.
    env_file: .env
    environment:
      ENVIRONMENT:       production
      DEBUG:             "false"
      DATABASE_URL:      postgresql+asyncpg://atsready:${POSTGRES_PASSWORD}@db:5432/atsready
      SYNC_DATABASE_URL: postgresql+psycopg2://atsready:${POSTGRES_PASSWORD}@db:5432/atsready
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - outputs:/app/outputs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No command override — the Dockerfile's production CMD runs uvicorn
    # with 2 workers, uvloop, and proxy-header support.

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    env_file: .env
    environment:
      ENVIRONMENT:       production
      DEBUG:             "false"
      DATABASE_URL:      postgresql+asyncpg://atsready:${POSTGRES_PASSWORD}@db:5432/atsready
      SYNC_DATABASE_URL: postgresql+psycopg2://atsready:${POSTGRES_PASSWORD}@db:5432/atsready
      REDIS_URL:         redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - outputs:/app/outputs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: arq app.worker.tasks.WorkerSettings

volumes:
  pgdata_prod:
    driver: local
  outputs:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
