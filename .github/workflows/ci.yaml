name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, master, paypal-gateway, production-hardening]
  pull_request:

jobs:
  # Fast, cheap, run on every push and PR — the first line of defense.
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atsready
          POSTGRES_USER: atsready
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U atsready -d atsready"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgresql+asyncpg://atsready:secret@localhost:5432/atsready
      SYNC_DATABASE_URL: postgresql+psycopg2://atsready:secret@localhost:5432/atsready
      REDIS_URL: redis://localhost:6379/0
      ENVIRONMENT: development
      LLM_FAKE: "true"
      JWT_SECRET: ci-only-secret-never-used-outside-github-actions-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Dockerfile base image
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip-audit -r requirements.txt --progress-spinner off --ignore-vuln CVE-2026-114605  # dnspython: fix 2.9.0 not on PyPI yet
      - run: ruff check app main.py tests scripts
      - run: alembic upgrade head
      - run: pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build   # the production bundle must compile

  # Performance, accessibility, SEO and best-practice budgets (frontend/lighthouserc.json).
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vite build --outDir dist-lhci --emptyOutDir
      - run: npx -y @lhci/cli@0.14.0 autorun

  # Committed secrets: scans the whole history.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Heavier (full docker-compose stack + browser) — only on pushes to
  # main/master so PR feedback stays fast and CI minutes stay controlled;
  # every merge still gets full end-to-end coverage.
  e2e-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [backend-tests, frontend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for the dev stack
        run: |
          cp .env.example .env
          # The e2e suite registers many accounts from one IP and must not spend LLM quota
          echo "RATE_LIMIT_ENABLED=false" >> .env
          echo "LLM_FAKE=true" >> .env

      - name: Start the dev stack
        run: docker compose -f docker-compose.yaml up -d --build api worker frontend db redis mailpit

      - name: Wait for the frontend to be reachable
        run: timeout 180 bash -c 'until curl -sf http://localhost:5173/login >/dev/null; do sleep 3; done'

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Branch pushes: full suite on desktop Chrome only (fast feedback).
      - name: Run E2E tests (Chromium)
        working-directory: e2e
        run: npx playwright test --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      # main/master and manual runs also cover other engines and phones (auth, a11y, account).
      - name: Run E2E tests (Firefox, WebKit, Pixel 7, iPhone 14)
        if: github.ref_name == 'main' || github.ref_name == 'master' || github.event_name == 'workflow_dispatch'
        working-directory: e2e
        run: |
          npx playwright install --with-deps firefox webkit
          npx playwright test --project=firefox --project=webkit --project=pixel-7 --project=iphone-14
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      # Slow-network run: the PRODUCTION bundle under throttled bandwidth/latency (the dev server
      # is unbundled and unrepresentative). `vite preview` proxies /api to the compose API.
      - name: Slow-network test (production build, throttled)
        run: |
          sudo chown -R "$USER" frontend   # the compose container created node_modules as root
          cd frontend && npm ci && npx vite build --outDir dist-e2e --emptyOutDir
          (npx vite preview --outDir dist-e2e --port 4173 > /tmp/preview.log 2>&1 &)
          timeout 60 bash -c 'until curl -sf http://localhost:4173/login >/dev/null; do sleep 2; done'
          cd ../e2e && SLOW_NETWORK=1 PLAYWRIGHT_BASE_URL=http://localhost:4173 npx playwright test slow-network --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Dump container logs on failure
        if: failure()
        run: docker compose -f docker-compose.yaml logs api worker frontend
