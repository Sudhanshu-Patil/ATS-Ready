<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Resume Agent{% endblock %} — Resume AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">RA</div>
      <span class="brand-name">Resume<br><strong>Agent</strong></span>
    </div>

    <nav class="sidebar-nav">
      <a href="/" class="nav-item {% if active == 'dashboard' %}active{% endif %}">
        <span class="nav-icon">
          <svg viewBox="0 0 20 20" fill="none"><rect x="2" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="2" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
        </span>
        Dashboard
      </a>
      <a href="/generate" class="nav-item {% if active == 'generate' %}active{% endif %}">
        <span class="nav-icon">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 3v14M3 10h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </span>
        Generate Resume
      </a>
      <a href="/metabase" class="nav-item {% if active == 'metabase' %}active{% endif %}">
        <span class="nav-icon">
          <svg viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </span>
        Metabase
      </a>
      <a href="/history" class="nav-item {% if active == 'history' %}active{% endif %}">
        <span class="nav-icon">
          <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="currentColor" stroke-width="1.5"/><path d="M10 6v4.5l3 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        History
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-footer-label">Powered by GPT-4o</div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <header class="page-header">
      <div class="page-header-left">
        <h1 class="page-title">{% block page_title %}{% endblock %}</h1>
        <p class="page-subtitle">{% block page_subtitle %}{% endblock %}</p>
      </div>
      <div class="page-header-right">
        {% block header_action %}{% endblock %}
      </div>
    </header>

    <div class="page-body">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Toast Notifications -->
  <div id="toast-container"></div>

  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
