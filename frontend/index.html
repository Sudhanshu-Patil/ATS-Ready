<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ATS-Ready | AI Resume Tailoring, ATS Score and Cover Letters</title>
    <meta name="description" content="Tailor your resume to any job description in seconds. AI resume optimization, ATS scoring, cover letters and interview prep." />
    <link rel="canonical" href="https://ats-ready.onrender.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ATS-Ready" />
    <meta property="og:title" content="ATS-Ready | Tailor your resume to any job in seconds" />
    <meta property="og:description" content="AI resume tailoring, ATS scoring, cover letters and interview prep." />
    <meta property="og:url" content="https://ats-ready.onrender.com/" />
    <meta property="og:image" content="https://ats-ready.onrender.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ATS-Ready: tailor your resume to any job in seconds" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ATS-Ready | Tailor your resume to any job in seconds" />
    <meta name="twitter:description" content="AI resume tailoring, ATS scoring, cover letters and interview prep." />
    <meta name="twitter:image" content="https://ats-ready.onrender.com/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0A0F" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "ATS-Ready",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "description": "AI resume tailoring, ATS scoring, cover letters and interview prep.",
          "url": "https://ats-ready.onrender.com/",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "description": "Free plan: 3 resumes per month" }
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is an ATS score?",
              "acceptedAnswer": { "@type": "Answer", "text": "An ATS score estimates how well a resume matches a job description for applicant tracking systems, based on keywords, skills, action verbs and formatting." }
            },
            {
              "@type": "Question",
              "name": "How does ATS-Ready tailor a resume?",
              "acceptedAnswer": { "@type": "Answer", "text": "You keep one profile of your skills, experience and projects. For each job description, ATS-Ready selects and rewrites the parts that match the role and exports a formatted resume." }
            },
            {
              "@type": "Question",
              "name": "Can I delete my data?",
              "acceptedAnswer": { "@type": "Answer", "text": "Yes. In Settings you can download all your data and permanently delete your account and generated files." }
            }
          ]
        }
      ]
    }
    </script>
    <script>
      // Runs before first paint to avoid a flash of the wrong theme. Must
      // stay in sync with the fallback logic in src/store/theme.js.
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved === 'light' || saved === 'dark'
          ? saved
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>ATS-Ready tailors your resume to any job description. Please enable JavaScript to use the app.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
